[workspace]
members = [
    "crates/pager-core",
    "crates/pager-ui",
    "crates/pager-dahua",
    "apps/pager-macos",
]
resolver = "2"

[workspace.package]
license = "Apache-2.0"
edition = "2024"

[workspace.dependencies]
embedded-graphics = "0.8.2"

[workspace.dependencies.pager-core]
path = "crates/pager-core"

[workspace.dependencies.pager-ui]
path = "crates/pager-ui"
