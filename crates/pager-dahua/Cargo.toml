[package]
name = "pager-dahua"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[features]
default = ["native"]
native = ["dep:digest_auth", "dep:reqwest", "dep:tokio", "dep:url"]
live-nvr-tests = []

[[test]]
name = "live_nvr"
required-features = ["live-nvr-tests"]

[dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "rustls"], optional = true }
digest_auth = { version = "0.3.1", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "sync", "time", "macros"], optional = true }
url = { version = "2", optional = true }

[dev-dependencies]
rustls = "0.23"
